<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lepidox</title>
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../../assets/icons/lepidox.svg" width="28" height="28" alt="">
      <span>Lepidox</span>
    </div>
    <button id="openOptions" type="button" class="button buttonGhost buttonSmall" data-i18n="manageLists"></button>
  </header>

  <main>
    <section id="session" class="panel session hidden">
      <div class="sessionTop">
        <span id="statusPill" class="pill"></span>
        <span id="counter" class="counter"></span>
      </div>

      <h1 id="currentScreen" class="sessionTitle"></h1>
      <p id="activeListName" class="sessionList"></p>

      <div class="timer">
        <span id="timerLabel" class="timerLabel"></span>
        <span id="countdown" class="timerValue"></span>
      </div>
      <div id="progress" class="progress"><div id="progressBar" class="progressBar"></div></div>

      <p id="sessionAlert" class="alert hidden" role="alert"></p>

      <div class="controls">
        <button id="previous" type="button" class="button buttonGhost buttonIcon" data-icon="previous"></button>
        <button id="pauseResume" type="button" class="button buttonPrimary"></button>
        <button id="next" type="button" class="button buttonGhost buttonIcon" data-icon="next"></button>
        <button id="stop" type="button" class="button buttonGhost dangerHover" data-icon="stop" data-i18n="stop"></button>
      </div>
    </section>

    <section id="screens" class="section hidden">
      <div class="sectionHead">
        <h2 data-i18n="screens"></h2>
        <input id="screenSearch" type="search" class="input searchInput hidden" autocomplete="off"
          data-i18n-attr="placeholder:searchScreens,aria-label:searchScreens">
      </div>
      <ol id="screenList" class="screenList"></ol>
    </section>

    <section id="lists" class="section hidden">
      <div class="sectionHead">
        <h2 data-i18n="yourLists"></h2>
        <button id="newList" type="button" class="button buttonGhost buttonSmall" data-icon="plus" data-i18n="newList"></button>
      </div>
      <ul id="listItems" class="listItems"></ul>
    </section>

    <details id="switchList" class="switchList hidden">
      <summary data-i18n="switchList"></summary>
      <ul id="otherListItems" class="listItems"></ul>
    </details>

    <section id="empty" class="empty hidden">
      <strong data-i18n="emptyTitle"></strong>
      <span data-i18n="emptyPopupHint"></span>
      <button id="createFromTabs" type="button" class="button buttonPrimary buttonBlock" data-icon="tabs" data-i18n="createFromTabs"></button>
      <button id="createManually" type="button" class="button buttonGhost buttonBlock" data-i18n="createManually"></button>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
