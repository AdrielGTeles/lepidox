<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lepidox</title>
  <link rel="icon" href="../../assets/icons/lepidox-32.png">
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="siteHeader">
    <div class="siteHeaderInner">
      <div class="brand">
        <img src="../../assets/icons/lepidox.svg" width="34" height="34" alt="">
        <div>
          <strong>Lepidox</strong>
          <small data-i18n="tagline"></small>
        </div>
      </div>
      <span id="sessionChip" class="pill hidden"></span>
    </div>
  </header>

  <main class="container">
    <div class="pageHead">
      <div>
        <h1 data-i18n="optionsTitle"></h1>
        <p data-i18n="optionsSubtitle"></p>
      </div>
      <div class="pageActions">
        <button id="importLists" type="button" class="button buttonGhost" data-icon="upload" data-i18n="import"></button>
        <button id="exportLists" type="button" class="button buttonGhost" data-icon="download" data-i18n="export"></button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </div>

    <div class="workspace">
      <aside class="panel sidebar">
        <div class="panelTitle">
          <h2 data-i18n="lists"></h2>
          <button id="newList" type="button" class="button buttonPrimary buttonSmall" data-icon="plus" data-i18n="newList"></button>
        </div>
        <ul id="listNav" class="listNav"></ul>
      </aside>

      <section id="welcome" class="panel welcome hidden">
        <div class="empty">
          <strong data-i18n="emptyTitle"></strong>
          <span data-i18n="emptyOptionsHint"></span>
          <button id="welcomeFromTabs" type="button" class="button buttonPrimary" data-icon="tabs" data-i18n="createFromTabs"></button>
          <button id="welcomeNew" type="button" class="button buttonGhost" data-i18n="createManually"></button>
        </div>
      </section>

      <section id="editor" class="panel editor hidden">
        <div class="editorHead">
          <label class="field editorName">
            <span class="fieldLabel" data-i18n="listName"></span>
            <input id="listName" class="input" maxlength="80" autocomplete="off">
          </label>
          <label class="field editorDuration">
            <span class="fieldLabel" data-i18n="timePerScreen"></span>
            <span class="inputSuffix">
              <input id="defaultDuration" class="input" type="number" min="5" step="1" inputmode="numeric">
              <span data-i18n="secondsUnit"></span>
            </span>
          </label>
          <button id="startStop" type="button" class="button buttonPrimary"></button>
        </div>
        <p id="listSummary" class="help"></p>

        <div class="screensHead">
          <h2><span data-i18n="screens"></span><span id="screenCount" class="countBadge"></span></h2>
          <div class="screensActions">
            <button id="addTabs" type="button" class="button buttonGhost buttonSmall" data-icon="tabs" data-i18n="addOpenTabs"></button>
            <button id="preflight" type="button" class="button buttonGhost buttonSmall" data-icon="shield" data-i18n="checkAccess"
              data-i18n-attr="title:checkAccessHelp"></button>
          </div>
        </div>

        <div class="screenColumns" aria-hidden="true">
          <span></span>
          <span></span>
          <span data-i18n="colUrl"></span>
          <span data-i18n="colName"></span>
          <span data-i18n="colTime"></span>
          <span data-i18n="colOn"></span>
          <span></span>
        </div>
        <ol id="screenRows" class="screenRows"></ol>
        <button id="addScreen" type="button" class="button buttonGhost addScreen" data-icon="plus" data-i18n="addScreen"></button>
        <p class="help" data-i18n="screensHint"></p>

        <details class="advanced">
          <summary data-i18n="advanced"></summary>
          <div class="option">
            <div>
              <strong id="poolSizeLabel" data-i18n="pausePreload"></strong>
              <p class="help" data-i18n="pausePreloadHelp"></p>
            </div>
            <div id="poolSize" class="segmented" role="radiogroup" aria-labelledby="poolSizeLabel"></div>
          </div>
          <div class="option">
            <div>
              <strong id="autoResumeLabel" data-i18n="autoResume"></strong>
              <p class="help" data-i18n="autoResumeHelp"></p>
            </div>
            <label class="switch">
              <input id="autoResume" type="checkbox" aria-labelledby="autoResumeLabel">
              <span class="switchTrack"></span>
            </label>
          </div>
        </details>

        <div class="editorFoot">
          <span id="saveStatus" class="help" aria-live="polite"></span>
          <div class="editorFootActions">
            <button id="duplicateList" type="button" class="button buttonGhost buttonSmall" data-icon="copy" data-i18n="duplicate"></button>
            <button id="deleteList" type="button" class="button buttonGhost buttonSmall dangerHover" data-icon="trash" data-i18n="deleteList"></button>
          </div>
        </div>
      </section>
    </div>

    <section class="panel shortcuts">
      <div class="panelTitle">
        <div>
          <h2 data-i18n="shortcuts"></h2>
          <p class="help" data-i18n="shortcutsHelp"></p>
        </div>
        <button id="editShortcuts" type="button" class="button buttonGhost buttonSmall" data-i18n="editShortcuts"></button>
      </div>
      <dl id="shortcutList" class="shortcutList"></dl>
    </section>
  </main>

  <footer class="siteFooter">
    <span id="versionLabel"></span>
    <span aria-hidden="true">·</span>
    <span data-i18n="footerPrivacy"></span>
    <span aria-hidden="true">·</span>
    <a id="sourceLink" target="_blank" rel="noopener" data-i18n="footerSource"></a>
    <span aria-hidden="true">·</span>
    <a id="privacyLink" target="_blank" rel="noopener" data-i18n="footerPrivacyPolicy"></a>
  </footer>

  <dialog id="tabsDialog" class="dialog">
    <form method="dialog">
      <h2 data-i18n="addOpenTabs"></h2>
      <p class="help" data-i18n="addOpenTabsHelp"></p>
      <div id="tabChoices" class="tabChoices"></div>
      <div class="dialogActions">
        <button type="submit" value="cancel" class="button buttonGhost" data-i18n="cancel"></button>
        <button id="confirmTabs" type="submit" value="confirm" class="button buttonPrimary"></button>
      </div>
    </form>
  </dialog>

  <dialog id="deleteDialog" class="dialog">
    <form method="dialog">
      <h2 data-i18n="deleteListTitle"></h2>
      <p id="deleteMessage" class="help"></p>
      <div class="dialogActions">
        <button type="submit" value="cancel" class="button buttonGhost" data-i18n="cancel"></button>
        <button type="submit" value="confirm" class="button buttonDanger" data-i18n="deleteList"></button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
